<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a5c"/>
    </marker>
    <marker id="gen" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M1,1 L15,8 L1,15 z" fill="#fff" stroke="#3c4a5c" stroke-width="1.6"/>
    </marker>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#3c4a5c" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1000" height="1320" fill="#ffffff"/>
  <text x="500" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#08213d" text-anchor="middle" dominant-baseline="middle">Activity diagram: student logs a fault</text><circle cx="380" cy="90" r="15" fill="#08213d"/><path d="M380,105 L380,128" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="128" width="320" height="64" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="380" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Open the portal</text><path d="M380,192 L380,228" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><polygon points="380,228 505,280 380,332 255,280" fill="#fdf3da" stroke="#f5b71d" stroke-width="2.4"/><text x="380" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Signed in?</text><path d="M505,280 L720,280 L720,320" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="584" y="267" width="32" height="26" rx="6" fill="#fff"/><text x="600" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">no</text><rect x="570" y="320" width="300" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="720" y="347.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Sign in as Student</text><text x="720" y="372.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(student email + password)</text><path d="M720,400 L720,432 L384,432" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><path d="M380,332 L380,438" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="313" y="367" width="41" height="26" rx="6" fill="#fff"/><text x="350" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="end" dominant-baseline="middle">yes</text><rect x="220" y="438" width="320" height="64" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="380" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Open "Log a fault"</text><path d="M380,502 L380,545" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="545" width="440" height="110" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="380" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Choose category, residence</text><text x="380" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(or "Other" + type name),</text><text x="380" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">room, urgency, description</text><path d="M380,655 L380,694" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><polygon points="380,694 505,746 380,798 255,746" fill="#fdf3da" stroke="#f5b71d" stroke-width="2.4"/><text x="380" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Add a photo?</text><path d="M505,746 L720,746 L720,790" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="579.5" y="733" width="41" height="26" rx="6" fill="#fff"/><text x="600" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">yes</text><rect x="570" y="790" width="300" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="720" y="817.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Resize photo in browser</text><text x="720" y="842.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(e.g. 9 MB → 0.5 MB)</text><path d="M720,870 L720,910" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="910" width="300" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="720" y="937.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Upload to Storage</text><text x="720" y="962.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(own folder only)</text><path d="M720,990 L720,1032 L384,1032" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><path d="M380,798 L380,1038" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="322" y="887" width="32" height="26" rx="6" fill="#fff"/><text x="350" y="900" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="end" dominant-baseline="middle">no</text><rect x="200" y="1038" width="360" height="64" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="380" y="1070" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Save ticket: status "Submitted"</text><path d="M380,1102 L380,1140" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="1140" width="380" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="380" y="1167.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Show request page with</text><text x="380" y="1192.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">history; appears in work queue</text><path d="M380,1220 L380,1262" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="380" cy="1282" r="18" fill="none" stroke="#08213d" stroke-width="3"/><circle cx="380" cy="1282" r="11" fill="#08213d"/>
