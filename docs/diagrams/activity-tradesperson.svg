<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1330" viewBox="0 0 1100 1330">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a5c"/>
    </marker>
    <marker id="gen" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M1,1 L15,8 L1,15 z" fill="#fff" stroke="#3c4a5c" stroke-width="1.6"/>
    </marker>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#3c4a5c" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1100" height="1330" fill="#ffffff"/>
  <text x="550" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#08213d" text-anchor="middle" dominant-baseline="middle">Activity diagram: tradesperson handles a job</text><circle cx="500" cy="90" r="15" fill="#08213d"/><path d="M500,105 L500,128" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="128" width="380" height="64" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="500" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Sign in as Maintenance tradesperson</text><path d="M500,192 L500,230" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="230" width="380" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="500" y="257.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">View work queue</text><text x="500" y="282.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(High urgency first, then oldest)</text><path d="M500,310 L500,350" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="350" width="300" height="64" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="500" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Open a job</text><path d="M500,414 L500,450" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,450 640,505 500,560 360,505" fill="#fdf3da" stroke="#f5b71d" stroke-width="2.4"/><text x="500" y="493.75" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Already taken by</text><text x="500" y="516.25" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">someone else?</text><path d="M640,505 L890,505 L890,560" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="749.5" y="492" width="41" height="26" rx="6" fill="#fff"/><text x="770" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">yes</text><rect x="760" y="560" width="260" height="80" rx="14" fill="#f3f6fa" stroke="#c2ccdb" stroke-width="2"/><text x="890" y="587.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">View only</text><text x="890" y="612.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(cannot change it)</text><path d="M890,640 L890,1260 L522,1260" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><path d="M500,560 L500,620" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="442" y="577" width="32" height="26" rx="6" fill="#fff"/><text x="470" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="end" dominant-baseline="middle">no</text><rect x="310" y="620" width="380" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="500" y="647.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Accept job + message student</text><text x="500" y="672.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">status → "Assigned"</text><path d="M500,700 L500,740" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="740" width="360" height="64" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="500" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Start work: status → "In Progress"</text><path d="M500,804 L500,850" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,850 640,905 500,960 360,905" fill="#fdf3da" stroke="#f5b71d" stroke-width="2.4"/><text x="500" y="905" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Fault fixed?</text><path d="M360,905 L230,905" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="261.5" y="867" width="77" height="26" rx="6" fill="#fff"/><text x="300" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">not yet</text><rect x="30" y="865" width="200" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="130" y="893.75" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Add progress</text><text x="130" y="916.25" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">note for student</text><path d="M130,865 L130,828 L494,828" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><path d="M500,960 L500,1010" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="526" y="972" width="41" height="26" rx="6" fill="#fff"/><text x="530" y="985" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="start" dominant-baseline="middle">yes</text><rect x="310" y="1010" width="380" height="80" rx="14" fill="#e2f3ea" stroke="#17794a" stroke-width="2"/><text x="500" y="1037.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Mark completed + message</text><text x="500" y="1062.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">status → "Completed"</text><path d="M500,1090 L500,1122" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="1122" width="380" height="80" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="500" y="1149.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Student sees every update in</text><text x="500" y="1174.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">history and on their dashboard</text><path d="M500,1202 L500,1238" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="500" cy="1260" r="18" fill="none" stroke="#08213d" stroke-width="3"/><circle cx="500" cy="1260" r="11" fill="#08213d"/>
</svg>