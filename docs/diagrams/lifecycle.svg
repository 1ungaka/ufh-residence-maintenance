  <text x="600" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#08213d" text-anchor="middle" dominant-baseline="middle">Life cycle of a maintenance request</text><circle cx="40" cy="170" r="15" fill="#08213d"/><path d="M55,170 L78,170" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="122" width="220" height="96" rx="14" fill="#f3f6fa" stroke="#c2ccdb" stroke-width="2"/><text x="150" y="158.125" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Submitted</text><text x="150" y="181.875" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">student logs the fault</text><rect x="340" y="122" width="220" height="96" rx="14" fill="#e3f1fb" stroke="#2e93d8" stroke-width="2"/><text x="450" y="158.125" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Assigned</text><text x="450" y="181.875" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">tradesperson accepts</text><rect x="640" y="122" width="220" height="96" rx="14" fill="#fdf3da" stroke="#f5b71d" stroke-width="2"/><text x="750" y="158.125" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">In Progress</text><text x="750" y="181.875" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">work has started</text><rect x="940" y="122" width="220" height="96" rx="14" fill="#e2f3ea" stroke="#17794a" stroke-width="2"/><text x="1050" y="158.125" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Completed</text><text x="1050" y="181.875" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#14202f" text-anchor="middle" dominant-baseline="middle">fault fixed</text><path d="M260,170 L338,170" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="247" y="125" width="104" height="26" rx="6" fill="#fff"/><text x="299" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">Accept job</text><path d="M560,170 L638,170" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="547" y="125" width="104" height="26" rx="6" fill="#fff"/><text x="599" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">Start work</text><path d="M860,170 L938,170" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="829" y="125" width="140" height="26" rx="6" fill="#fff"/><text x="899" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">Mark completed</text><path d="M700,218 C700,290 800,290 800,218" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#667588" text-anchor="middle" dominant-baseline="middle">progress notes and student comments (any open stage)</text><circle cx="1175" cy="170" r="18" fill="none" stroke="#08213d" stroke-width="3"/><circle cx="1175" cy="170" r="11" fill="#08213d"/><path d="M1160,170 L1157,170" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/>
