<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a5c"/>
    </marker>
    <marker id="gen" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M1,1 L15,8 L1,15 z" fill="#fff" stroke="#3c4a5c" stroke-width="1.6"/>
    </marker>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#3c4a5c" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#08213d" text-anchor="middle" dominant-baseline="middle">System architecture</text><rect x="45" y="125" width="250" height="150" rx="14" fill="#fdf3da" stroke="#f5b71d" stroke-width="2"/><text x="170" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Students and</text><text x="170" y="177.5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">tradespeople</text><text x="170" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle"></text><text x="170" y="222.5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Web browser</text><text x="170" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(computer or phone)</text><rect x="435" y="80" width="330" height="120" rx="14" fill="#e3f1fb" stroke="#143f6b" stroke-width="2"/><text x="600" y="117.5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Vercel</text><text x="600" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Hosts the React app</text><text x="600" y="162.5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(HTML, JavaScript, CSS)</text><rect x="435" y="285" width="330" height="90" rx="14" fill="#f3f6fa" stroke="#c2ccdb" stroke-width="2"/><text x="600" y="319.375" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">GitHub repository</text><text x="600" y="340.625" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">push to main = new deploy</text><rect x="330" y="430" width="840" height="260" rx="18" fill="#f7fbf8" stroke="#17794a" stroke-width="2.2" stroke-dasharray="10 6"/><text x="750" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17794a" text-anchor="middle" dominant-baseline="middle">Supabase (backend as a service)</text><rect x="350" y="495" width="220" height="130" rx="14" fill="#fff" stroke="#17794a" stroke-width="2"/><text x="460" y="538.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Auth</text><text x="460" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">sign-in, roles,</text><text x="460" y="581.25" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">reset links</text><rect x="585" y="495" width="230" height="130" rx="14" fill="#fff" stroke="#17794a" stroke-width="2"/><text x="700" y="538.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">PostgreSQL</text><text x="700" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">tickets, updates,</text><text x="700" y="581.25" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">profiles + RLS</text><rect x="830" y="495" width="220" height="130" rx="14" fill="#fff" stroke="#17794a" stroke-width="2"/><text x="940" y="538.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Storage</text><text x="940" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">fault photos</text><text x="940" y="581.25" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">(maintenance-files)</text><rect x="960" y="195" width="200" height="110" rx="14" fill="#fff" stroke="#17794a" stroke-width="2"/><text x="1060" y="228.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">Edge Function</text><text x="1060" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">notify-users</text><text x="1060" y="271.25" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#14202f" text-anchor="middle" dominant-baseline="middle">→ email</text><path d="M295,170 L433,150" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="115" width="158" height="26" rx="6" fill="#fff"/><text x="364" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">1. load the site</text><path d="M600,285 L600,202" fill="none" stroke="#3c4a5c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="609.5" y="230" width="77" height="26" rx="6" fill="#fff"/><text x="648" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">deploys</text><path d="M210,275 L210,560 L348,560" fill="none" stroke="#3c4a5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="208" y="407" width="149" height="26" rx="6" fill="#fff"/><text x="212" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="start" dominant-baseline="middle">2. HTTPS / JSON</text><path d="M1060,495 L1060,307" fill="none" stroke="#3c4a5c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="981" y="387" width="158" height="26" rx="6" fill="#fff"/><text x="1060" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#143f6b" text-anchor="middle" dominant-baseline="middle">on ticket change</text><text x="1060" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#667588" text-anchor="middle" dominant-baseline="middle">emails the student</text>
</svg>